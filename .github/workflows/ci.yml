name: Vision AI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VISION_AI_DATABASE_URL: sqlite:////tmp/vision-ai-ci.db
      VISION_AI_UPLOAD_DIR: /tmp/vision-ai-uploads
      VISION_AI_CLOUDINARY_URL: ""
      VISION_AI_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters
      VISION_AI_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: npm run check
      - run: npm run check:yolo
      - run: npm run build
      - run: pip install -r backend/requirements.txt
      - name: Upgrade database from zero
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration rollback and replay
        working-directory: backend
        run: alembic downgrade base && alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VISION_AI_DATABASE_URL: ${{ secrets.VISION_AI_DATABASE_URL }}
      VISION_AI_ENCRYPTION_KEY: ${{ secrets.VISION_AI_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Require production database secret
        shell: bash
        run: test -n "$VISION_AI_DATABASE_URL"
      - name: Upgrade Aiven schema
        working-directory: backend
        run: alembic upgrade head
